<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIR | TFG Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="container py-4">
    <header class="mb-5 d-flex justify-content-between align-items-center">
        <h2 class="fw-bold">FIR</h2>
        <div class="d-flex align-items-center">
            <button id="toggleBtn" class="btn btn-sm btn-outline-danger me-3 fw-bold" onclick="toggleEngine()">
                PAUSAR MOTOR
            </button>
            <span id="statusDot" class="status-online me-2"></span>
            <span id="statusText" class="small text-uppercase">Motor de IA Conectado</span>
        </div>
    </header>

    <details class="station-settings card mb-4 border-secondary bg-dark">
        <summary class="card-header text-uppercase small ls-wide text-info">
            ⚙️ Configuración de Estación
        </summary>
        <div class="card-body row g-3">
            <div class="col-md-3">
                <label class="small text-muted">Usuario QRZ (Opcional)</label>
                <input type="text" id="cfgUser" class="form-control form-control-sm bg-dark text-white border-secondary">
            </div>
            <div class="col-md-3">
                <label class="small text-muted">Contraseña QRZ (Opcional)</label>
                <input type="password" id="cfgPass" class="form-control form-control-sm bg-dark text-white border-secondary">
            </div>
            <div class="col-md-2">
                <label class="small text-muted">Mi Indicativo *</label>
                <input type="text" id="cfgMyCall" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="EA4IAX">
            </div>
            <div class="col-md-2">
                <label class="small text-muted">Banda</label>
                <select id="cfgBand" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="2M">2 Meters</option>
                    <option value="40M">40 Meters</option>
                    <option value="20M">20 Meters</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="small text-muted">Modo</label>
                <select id="cfgMode" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="SSB">SSB</option>
                    <option value="FM">FM</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="small text-muted">Salida de Audio (TX)</label>
                <select id="cfgAudioOut" class="form-select form-select-sm bg-dark text-white border-secondary">
                    <option value="-1">Cargando dispositivos...</option>
                </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-info btn-sm w-100 fw-bold" onclick="saveStationSettings()">GUARDAR</button>
            </div>
        </div>
    </details>

    <div class="row g-4">
        <div class="col-lg-8">
            <h5 class="mb-3 text-uppercase small ls-wide">Transcripción en Vivo</h5>
            <div id="transcription" class="transcription-box mb-4">
                Sincronizando con Whisper...
            </div>
            
            <h5 class="mb-3 text-uppercase small ls-wide">Módulo de Transmisión (TX)</h5>
            <div class="input-group">
                <input type="text" id="txInput" class="form-control border-0 bg-dark text-white p-3" placeholder="Escribe el mensaje para sintetizar y transmitir...">
                <button class="btn btn-warning px-4 fw-bold" onclick="sendTX()">ENVIAR</button>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="manual-entry-box mb-4 p-3 bg-dark border border-secondary rounded">
                <h6 class="text-uppercase small text-info mb-3 ls-wide">Entrada Manual de Contacto</h6>
                <div class="input-group input-group-sm">
                    <input type="text" id="manualCallInput" class="form-control bg-dark text-white border-secondary" placeholder="Ej: EA1ABC">
                    <button class="btn btn-info fw-bold" onclick="addManualCallsign()">VALIDAR</button>
                </div>
            </div>
            <h5 class="mb-3 text-uppercase small ls-wide">Contactos Registrados</h5>
            
            <div id="contactsList" style="max-height: 500px; overflow-y: auto;">
            </div>

            <div class="mt-5 pt-4 border-top border-secondary">
                <h6 class="text-uppercase small text-muted mb-3 ls-wide">Gestión del Sistema</h6>
                <button class="btn btn-outline-info w-100 fw-bold py-2 mb-3" onclick="downloadReport()">
                    💾 EXPORTAR LOGBOOK (ADIF)
                </button>
                <button class="btn btn-outline-danger w-100 fw-bold py-2" onclick="shutdownSystem()" style="border-style: dashed;">
                    🛑 DETENER TODO EL SISTEMA
                </button>
                <p class="extra-small text-muted mt-2 text-center" style="font-size: 0.7rem;">
                    Esto cerrará el motor C++, el servidor API y el proceso Nginx.
                </p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
